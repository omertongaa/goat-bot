<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goat · Setup</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f97316'/%3E%3Ctext x='50' y='72' font-family='Inter, sans-serif' font-size='62' font-weight='800' text-anchor='middle' fill='white'%3Eg%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b; --surface: #0f0f12; --surface-2: #16161b; --surface-3: #1d1d24;
  --border: #26262e; --text: #f5f5f7; --text-2: #c3c3cc; --dim: #7a7a85;
  --accent: #f97316; --green: #22c55e; --red: #ef4444; --yellow: #eab308;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
  background-image: radial-gradient(circle at 20% 0%, rgba(249, 115, 22, 0.08), transparent 50%),
                    radial-gradient(circle at 80% 100%, rgba(168, 85, 247, 0.06), transparent 50%);
}
.wizard {
  width: 100%; max-width: 520px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px; box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.brand-mark {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--accent), #ea580c);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 18px;
  box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
}
.brand .name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.brand .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }

.steps { display: flex; gap: 6px; margin-bottom: 24px; }
.step-dot {
  flex: 1; height: 3px; background: var(--surface-3); border-radius: 99px;
  transition: background 0.3s;
}
.step-dot.active, .step-dot.done { background: var(--accent); }

h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
.lead { color: var(--text-2); font-size: 13.5px; margin-bottom: 24px; line-height: 1.55; }

label {
  display: block; font-size: 11px; text-transform: uppercase;
  color: var(--dim); letter-spacing: 0.08em; margin-bottom: 6px; font-weight: 600;
}
input, textarea, select {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 11px 13px; border-radius: 8px;
  font-size: 13px; font-family: inherit; transition: border-color 0.12s;
  margin-bottom: 16px;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; min-height: 64px; }
.hint { font-size: 11.5px; color: var(--dim); margin-top: -10px; margin-bottom: 16px; line-height: 1.5; }
.hint a { color: var(--accent); text-decoration: underline; }
.opt-tag { font-size: 10px; color: var(--dim); margin-left: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }

.actions {
  display: flex; gap: 8px; margin-top: 24px;
}
.actions .spacer { flex: 1; }
.btn {
  padding: 11px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  cursor: pointer; transition: all 0.12s;
}
.btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--dim); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #ea580c; }
.btn.skip { background: transparent; color: var(--dim); border-color: transparent; }

.field-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.test-row { display: flex; gap: 6px; align-items: center; margin-top: -10px; margin-bottom: 12px; }
.test-row .status {
  font-size: 11px; padding: 3px 8px; border-radius: 99px;
  background: var(--surface-2); color: var(--dim);
}
.test-row .status.ok { background: rgba(34, 197, 94, 0.12); color: var(--green); }
.test-row .status.err { background: rgba(239, 68, 68, 0.12); color: var(--red); }
.btn.tiny { padding: 4px 10px; font-size: 11px; }

.success-icon {
  width: 64px; height: 64px; margin: 0 auto 16px;
  background: rgba(34, 197, 94, 0.12); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
}
</style>
</head>
<body>
<div class="wizard">
  <div class="brand">
    <div class="brand-mark">g</div>
    <div>
      <div class="name">goat</div>
      <div class="sub">Otonom ajan kurulumu</div>
    </div>
  </div>

  <div class="steps">
    <div class="step-dot active" data-i="0"></div>
    <div class="step-dot" data-i="1"></div>
    <div class="step-dot" data-i="2"></div>
    <div class="step-dot" data-i="3"></div>
  </div>

  <div id="stage"></div>
</div>

<script>
const STATE = { step: 0, data: {} };

const STAGES = [
  // Step 0 — Şirket profili
  () => `
    <h2>Şirketi tanıtalım</h2>
    <p class="lead">Ajanlar bu bilgileri kullanarak müşteri arar, içerik üretir, teklif hazırlar.</p>
    <label>Şirket / ajans adı</label>
    <input id="f_name" placeholder="GOAT Dijital">
    <label>Ne iş yapıyorsun? <span class="opt-tag">niş</span></label>
    <input id="f_niche" placeholder="Restoran otomasyonu">
    <label>Hedef şehirler <span class="opt-tag">virgülle</span></label>
    <input id="f_cities" placeholder="İstanbul, Ankara">
    <label>Hangi sektörlere satıyorsun? <span class="opt-tag">virgülle</span></label>
    <input id="f_industries" placeholder="restoran, klinik, kuaför">
    <div class="actions">
      <div class="spacer"></div>
      <button class="btn primary" onclick="nextStep()">Devam →</button>
    </div>
  `,
  // Step 1 — Anthropic
  () => `
    <h2>Claude ile konuşturalım</h2>
    <p class="lead">CEO ajanı her şeyi Claude ile düşünüyor. Anthropic API key'i olmadan sadece basit kelime eşleşmesi yapar.</p>
    <label>Anthropic API key</label>
    <input id="f_anthropic" type="password" placeholder="sk-ant-api03-...">
    <p class="hint">Yoksa <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a> üzerinden ücretsiz al. Vercel env'e otomatik kaydedilecek.</p>
    <div class="actions">
      <button class="btn" onclick="prevStep()">← Geri</button>
      <div class="spacer"></div>
      <button class="btn skip" onclick="nextStep()">Sonra ekle</button>
      <button class="btn primary" onclick="nextStep()">Devam →</button>
    </div>
  `,
  // Step 2 — Apify + opsiyoneller
  () => `
    <h2>Lead bulma & içerik araçları</h2>
    <p class="lead">Apify Scout için şart, fal.ai görsel için, Composio Gmail/Slack için.</p>
    <label>Apify token <span class="opt-tag">scout</span></label>
    <input id="f_apify" type="password" placeholder="apify_api_...">
    <p class="hint">Ücretsiz tier var: <a href="https://console.apify.com/account/integrations" target="_blank">console.apify.com</a></p>
    <label>fal.ai key <span class="opt-tag">opsiyonel — görsel</span></label>
    <input id="f_fal" type="password" placeholder="...">
    <label>Composio API key <span class="opt-tag">opsiyonel — Gmail/Slack/Notion</span></label>
    <input id="f_composio" type="password" placeholder="ak_...">
    <div class="actions">
      <button class="btn" onclick="prevStep()">← Geri</button>
      <div class="spacer"></div>
      <button class="btn skip" onclick="nextStep()">Sonra ekle</button>
      <button class="btn primary" onclick="nextStep()">Devam →</button>
    </div>
  `,
  // Step 3 — Tamamla
  () => `
    <div class="success-icon">🎉</div>
    <h2 style="text-align:center;">Hazırız!</h2>
    <p class="lead" style="text-align:center;">Ayarlar kaydediliyor… Bittiğinde Board'a yönlendireceğim.</p>
    <div id="finishStatus" style="text-align:center; color: var(--dim); font-size: 12px; margin-top: 16px;">⏳ Kaydediliyor</div>
  `,
];

function render() {
  document.getElementById('stage').innerHTML = STAGES[STATE.step]();
  document.querySelectorAll('.step-dot').forEach((d, i) => {
    d.classList.toggle('done', i < STATE.step);
    d.classList.toggle('active', i === STATE.step);
  });
  if (STATE.step === STAGES.length - 1) finish();
}

function captureCurrent() {
  const get = id => (document.getElementById(id) || {}).value;
  if (STATE.step === 0) {
    STATE.data.name = get('f_name').trim();
    STATE.data.niche = get('f_niche').trim();
    STATE.data.target_cities = get('f_cities').split(',').map(s => s.trim()).filter(Boolean);
    STATE.data.target_industries = get('f_industries').split(',').map(s => s.trim()).filter(Boolean);
  }
  if (STATE.step === 1) {
    const k = get('f_anthropic').trim();
    if (k) STATE.data.anthropic_api_key = k;
  }
  if (STATE.step === 2) {
    const apify = get('f_apify').trim();
    const fal = get('f_fal').trim();
    const composio = get('f_composio').trim();
    if (apify) STATE.data.apify_token = apify;
    if (fal) STATE.data.fal_key = fal;
    if (composio) STATE.data.composio_api_key = composio;
  }
}

function nextStep() {
  captureCurrent();
  if (STATE.step < STAGES.length - 1) STATE.step++;
  render();
}
function prevStep() { if (STATE.step > 0) STATE.step--; render(); }

async function finish() {
  const status = document.getElementById('finishStatus');
  try {
    const r = await fetch('/api/core/onboarding/complete', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(STATE.data),
    });
    const d = await r.json();
    if (d.ok) {
      status.innerHTML = '✓ Tamam! Board\'a yönlendiriliyorsun…';
      status.style.color = 'var(--green)';
      setTimeout(() => location.href = '/board', 1500);
    } else {
      status.innerHTML = '⚠ ' + (d.error || 'Bilinmeyen hata');
      status.style.color = 'var(--red)';
    }
  } catch (e) {
    status.innerHTML = '⚠ Sunucuya ulaşılamadı.';
    status.style.color = 'var(--red)';
  }
}

render();
</script>
</body>
</html>
