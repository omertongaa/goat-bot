<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goat · Workflows</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f97316'/%3E%3Ctext x='50' y='72' font-family='Inter, sans-serif' font-size='62' font-weight='800' text-anchor='middle' fill='white'%3Eg%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b; --surface: #0f0f12; --surface-2: #16161b; --surface-3: #1d1d24;
  --border: #26262e; --text: #f5f5f7; --text-2: #c3c3cc; --dim: #7a7a85;
  --accent: #f97316; --green: #22c55e; --yellow: #eab308; --blue: #3b82f6; --red: #ef4444;
  --radius: 10px; --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
code { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }

header {
  display: flex; align-items: center; padding: 0 24px; height: 56px;
  background: var(--surface); border-bottom: 1px solid var(--border); gap: 16px;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
.logo-mark {
  width: 26px; height: 26px; background: linear-gradient(135deg, var(--accent), #ea580c);
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 13px;
}
.bread { color: var(--dim); font-size: 12px; }
.nav-tabs { display: flex; gap: 2px; margin-left: 12px; }
.nav-tab { padding: 6px 12px; font-size: 12px; color: var(--dim); border-radius: var(--radius-sm); }
.nav-tab:hover { color: var(--text-2); background: var(--surface-2); }
.nav-tab.active { color: var(--text); background: var(--surface-2); }
.spacer { flex: 1; }

.container { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; }
.heading { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
.heading h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.heading .count { font-size: 12px; color: var(--dim); }
.subtitle { color: var(--dim); margin-bottom: 24px; font-size: 12.5px; line-height: 1.55; max-width: 720px; }

.section-tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.section-tab {
  padding: 9px 14px; font-size: 12.5px; color: var(--dim); font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.section-tab.active { color: var(--text); border-bottom-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s;
}
.card:hover { border-color: var(--accent); }
.card .row { display: flex; align-items: center; gap: 8px; }
.card .name { font-weight: 600; font-size: 13.5px; flex: 1; }
.card .pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 99px; font-size: 10.5px; color: var(--text-2);
}
.card .pill.trigger-webhook { color: var(--blue); border-color: rgba(59,130,246,.25); background: rgba(59,130,246,.08); }
.card .pill.trigger-schedule { color: var(--yellow); border-color: rgba(234,179,8,.25); background: rgba(234,179,8,.08); }
.card .pill.trigger-manual { color: var(--dim); }
.card .pill.support-100 { color: var(--green); border-color: rgba(34,197,94,.25); background: rgba(34,197,94,.08); }
.card .pill.support-mid { color: var(--yellow); }
.card .pill.support-low { color: var(--red); }
.card .nodes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.card .node-chip {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 2px 6px; background: var(--surface-2); border-radius: 4px; color: var(--text-2);
}
.card .actions { display: flex; gap: 6px; margin-top: 6px; }
.btn {
  padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); font-size: 11.5px; font-weight: 500;
}
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--red); border-color: rgba(239,68,68,.3); }
.empty { padding: 60px 20px; text-align: center; color: var(--dim); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }

.drawer {
  position: fixed; top: 0; right: 0; width: 640px; max-width: 100vw;
  height: 100vh; background: var(--surface); border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform 0.2s ease; z-index: 10;
  display: flex; flex-direction: column; box-shadow: -16px 0 40px rgba(0,0,0,.5);
}
.drawer.open { transform: translateX(0); }
.drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.drawer-head h3 { font-size: 14px; font-weight: 600; flex: 1; }
.drawer-body { flex: 1; overflow: auto; padding: 16px 20px; }
.run-row { padding: 10px 12px; background: var(--surface-2); border-radius: 6px; margin-bottom: 8px; font-size: 12px; }
.run-row .ts { color: var(--dim); font-size: 10.5px; }
.run-row.ok { border-left: 3px solid var(--green); }
.run-row.fail { border-left: 3px solid var(--red); }
textarea {
  width: 100%; min-height: 120px; padding: 10px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
}
</style>
</head>
<body>
<header>
  <a href="/" class="logo"><div class="logo-mark">g</div><div>goat</div></a>
  <div class="bread">· Workflows</div>
  <div class="nav-tabs">
    <a class="nav-tab" href="/board">Board</a>
    <a class="nav-tab" href="/files">Dosyalar</a>
    <a class="nav-tab active" href="/workflows">Workflows</a>
    <a class="nav-tab" href="/apify">Apify</a>
    <a class="nav-tab" href="/apps">Apps</a>
  </div>
  <div class="spacer"></div>
</header>

<div class="container">
  <div class="heading">
    <h1>⚡ Workflows</h1>
    <span class="count" id="counts">—</span>
  </div>
  <div class="subtitle">
    n8n workflow JSON'ları — goat-bot içinde native koşar, ayrı n8n server gerekmez.
    Webhook, Telegram, HTTP, set, if, gmail, slack ve LLM node'ları desteklenir;
    desteklenmeyenler atlanır ve loglanır.
  </div>

  <div class="section-tabs">
    <button class="section-tab active" id="tabTpl" onclick="setTab('templates')">📦 Şablonlar</button>
    <button class="section-tab" id="tabIns" onclick="setTab('installed')">✅ Kurulu</button>
  </div>

  <div id="grid" class="grid"></div>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 id="drawerTitle">Workflow</h3>
    <button class="btn" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script>
let STATE = { tab: 'templates', templates: [], installed: [] };

async function load() {
  const [tplRes, insRes] = await Promise.all([
    fetch('/api/automations/templates').then(r => r.json()),
    fetch('/api/automations/installed').then(r => r.json()),
  ]);
  STATE.templates = tplRes.templates || tplRes || [];
  STATE.installed = insRes.installed || insRes || [];
  document.getElementById('counts').textContent = `${STATE.templates.length} şablon · ${STATE.installed.length} kurulu`;
  render();
}

function setTab(t) {
  STATE.tab = t;
  document.getElementById('tabTpl').classList.toggle('active', t === 'templates');
  document.getElementById('tabIns').classList.toggle('active', t === 'installed');
  render();
}

function render() {
  const grid = document.getElementById('grid');
  const items = STATE.tab === 'templates' ? STATE.templates : STATE.installed;
  if (!items.length) {
    grid.innerHTML = '<div class="empty">Boş — diğer sekmeye bak</div>';
    return;
  }
  grid.innerHTML = items.map(t => {
    const trig = t.trigger || 'manual';
    const supportPct = t.supported_pct ?? 100;
    const supportClass = supportPct >= 80 ? 'support-100' : (supportPct >= 50 ? 'support-mid' : 'support-low');
    const types = t.node_types || [];
    return `
      <div class="card">
        <div class="row">
          <div class="name">${t.name || t.id}</div>
        </div>
        <div class="row">
          <span class="pill trigger-${trig}">⚡ ${trig}</span>
          <span class="pill ${supportClass}">${supportPct}% destek</span>
          <span class="pill">${(t.node_count ?? types.length)} node</span>
        </div>
        <div class="nodes">${types.slice(0, 8).map(n => `<span class="node-chip">${n}</span>`).join('')}</div>
        <div class="actions">
          ${STATE.tab === 'templates'
            ? `<button class="btn primary" onclick="install('${t.id}')">Kur</button>
               <button class="btn" onclick="preview('${t.id}', false)">İncele</button>`
            : `<button class="btn primary" onclick="trig('${t.id}')">Tetikle</button>
               <button class="btn" onclick="preview('${t.id}', true)">Geçmiş</button>
               <button class="btn danger" onclick="del('${t.id}')">Sil</button>`}
        </div>
      </div>
    `;
  }).join('');
}

async function install(template_id) {
  const r = await fetch('/api/automations/install', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ template_id }),
  });
  const data = await r.json();
  if (data.error) { alert('Hata: ' + data.error); return; }
  alert(`✓ "${data.name}" kuruldu`);
  load();
}

async function trig(automation_id) {
  const payload = prompt('JSON payload (boş bırakabilirsin):', '{"name":"Test User","email":"test@example.com"}');
  let body = {};
  if (payload && payload.trim()) {
    try { body = JSON.parse(payload); } catch { alert('Geçersiz JSON'); return; }
  }
  const r = await fetch(`/api/automations/${automation_id}/trigger`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  const data = await r.json();
  alert(data.ok ? `✓ ${(data.log || []).length} adım koştu` : 'Hata: ' + (data.error || 'fail'));
  load();
}

async function del(automation_id) {
  if (!confirm('Silinsin mi?')) return;
  await fetch(`/api/automations/${automation_id}`, { method: 'DELETE' });
  load();
}

async function preview(id, isInstalled) {
  const drawer = document.getElementById('drawer');
  const body = document.getElementById('drawerBody');
  const title = document.getElementById('drawerTitle');
  drawer.classList.add('open');
  body.textContent = 'Yükleniyor…';
  if (isInstalled) {
    const item = STATE.installed.find(x => x.id === id) || {};
    title.textContent = item.name || id;
    const runs = (item.runs || []).slice().reverse();
    body.innerHTML = runs.length
      ? runs.map(r => `
          <div class="run-row ${r.ok ? 'ok' : 'fail'}">
            <div class="ts">${r.started_at}</div>
            <div>${(r.log || []).map(s => `<code>${s.node || '?'}</code> ${s.status}`).join(' → ')}</div>
          </div>
        `).join('')
      : '<div class="empty">Henüz koşu yok</div>';
  } else {
    const r = await fetch(`/api/automations/templates/${id}`).then(r => r.json());
    title.textContent = r.name || id;
    const nodes = (r.workflow?.nodes) || r.nodes || [];
    body.innerHTML = `
      <textarea readonly>${JSON.stringify(r, null, 2)}</textarea>
      <div style="margin-top:14px; color:var(--dim); font-size:11.5px;">${nodes.length} node · trigger: ${r.trigger || 'manual'}</div>
    `;
  }
}

function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

load();
</script>
</body>
</html>
